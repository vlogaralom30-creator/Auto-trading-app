name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to compile'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all
      run_tests:
        description: 'Run Unit Tests before building'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Naxxivo APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Configure Keystore & Environment Secrets
        run: |
          # 1. Decode debug keystore if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully decoded debug.keystore"
          fi

          # 2. Generate fallback debug keystore if missing
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new fallback debug.keystore"
          fi

          # 3. Setup environment secrets
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Run Unit & Robolectric Tests
        if: "${{ github.event.inputs.run_tests != false }}"
        run: |
          ./gradlew testDebugUnitTest --stacktrace || gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch' }}"
        run: |
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
          mkdir -p output-apks
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output-apks/Naxxivo-Browser-Debug.apk
            echo "Prepared Debug APK: output-apks/Naxxivo-Browser-Debug.apk"
          fi

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' }}"
        run: |
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace || true
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output-apks/Naxxivo-Browser-Release.apk
            echo "Prepared Release APK: output-apks/Naxxivo-Browser-Release.apk"
          fi

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Naxxivo-Browser-APK
          path: output-apks/*.apk
          retention-days: 90

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          name: Naxxivo Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
