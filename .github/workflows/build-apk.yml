name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Keystore & Environment
        run: |
          # If debug.keystore.base64 exists, decode it
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from base64"
          fi
          
          # If debug.keystore still doesn't exist, generate a standard one
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

          # Ensure .env exists with placeholder if not provided
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew testDebugUnitTest --stacktrace
          else
            gradle testDebugUnitTest --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find & Rename Output APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" app/build/outputs/apk/debug/Naxxivo-ChartMind-AutoTrader.apk
            echo "apk_path=app/build/outputs/apk/debug/Naxxivo-ChartMind-AutoTrader.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naxxivo-ChartMind-AutoTrader-APK
          path: app/build/outputs/apk/debug/Naxxivo-ChartMind-AutoTrader.apk
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/Naxxivo-ChartMind-AutoTrader.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
